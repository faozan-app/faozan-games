<style>
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100dvh;
 background:linear-gradient(150deg,#10172b,#263c62);
 color:white;
 font-family:Arial,sans-serif;
 text-align:center;
 padding:25px 12px
}
main{max-width:420px;margin:auto}
.back{color:#c1e8ff;text-decoration:none}
h1{font-size:34px;margin:22px 0 8px}
.sub{color:#b9d5ed}
.panel{
 background:#ffffff17;
 border:1px solid #ffffff45;
 padding:18px;
 border-radius:24px;
 margin-top:26px;
 box-shadow:0 16px 34px #0005
}
.stats{
 display:flex;
 justify-content:space-around;
 margin-bottom:15px;
 font-weight:bold
}
#board{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:9px;
 background:#08152888;
 padding:10px;
 border-radius:20px;
 aspect-ratio:1
}
.tile{
 min-width:0;
 border:1px solid #ffffff55;
 border-radius:16px;
 background:linear-gradient(145deg,#a1d8ed,#347dae);
 box-shadow:inset 0 2px 4px #ffffff66,0 4px 8px #0005;
 color:white;
 font-size:clamp(28px,8vw,43px);
 font-weight:800;
 cursor:pointer
}
.empty{
 background:transparent;
 border-color:transparent;
 box-shadow:none
}
.actions{display:flex;gap:10px}
.actions button{
 flex:1;
 min-height:52px;
 border:0;
 border-radius:22px;
 background:linear-gradient(90deg,#29d4ff,#56ee91);
 font-weight:bold;
 font-size:15px;
 color:#10243c;
 cursor:pointer;
 margin-top:20px
}
.actions button.secondary{
 background:#ffffff26;
 color:white;
 border:1px solid #ffffff45
}
#status{
 min-height:50px;
 line-height:1.5;
 color:#c9e8fc
}
</style>
</head>
<body>
<main>
<a class="back" href="./">← FAOZAN GAMES</a>
<h1>FAOZAN Numbers</h1>
<p class="sub">Play Free. Think Smart. Have Fun.</p>

<section class="panel">
 <div class="stats">
  <span id="level">LEVEL 1</span>
  <span id="moves">MOVES 0</span>
 </div>

 <div id="board" aria-label="Sliding number puzzle"></div>

 <div class="actions">
  <button class="secondary" id="restart">RESTART</button>
  <button id="new">NEW PUZZLE</button>
 </div>

 <p id="status" aria-live="polite">
  Slide a tile into the empty space.
 </p>
</section>
</main>

<script>
(()=>{
'use strict';

const board=document.getElementById('board'),
status=document.getElementById('status'),
movesLabel=document.getElementById('moves'),
levelLabel=document.getElementById('level'),
newButton=document.getElementById('new');

let level=1,tiles=[],initial=[],moves=0,won=false;

try{
 level=Math.max(
  1,
  parseInt(localStorage.getItem('faozan_numbers_level')||'1',10)||1
 )
}catch(e){}

const size=()=>level<6?3:level<16?4:5;

const solved=n=>Array.from(
 {length:n*n},
 (_,i)=>(i+1)%(n*n)
);

const neighbor=(i,n)=>[
 i%n>0?i-1:-1,
 i%n<n-1?i+1:-1,
 i>=n?i-n:-1,
 i<n*(n-1)?i+n:-1
].filter(x=>x>=0);

function draw(){
 const n=size();
 board.style.gridTemplateColumns='repeat('+n+',1fr)';
 board.replaceChildren();

 tiles.forEach((v,i)=>{
  const b=document.createElement('button');
  b.className='tile'+(v===0?' empty':'');
  b.textContent=v===0?'':String(v);
  b.disabled=v===0||won;
  b.setAttribute('aria-label',v?'Tile '+v:'Empty');
  b.addEventListener('click',()=>move(i));
  board.appendChild(b);
 });

 movesLabel.textContent='MOVES '+moves;
 levelLabel.textContent='LEVEL '+level;
}

function start(){
 const n=size();
 tiles=solved(n);
 let empty=tiles.length-1,previous=-1;

 for(let k=0;k<n*n*35;k++){
  let options=neighbor(empty,n).filter(i=>i!==previous),
  pick=options[Math.floor(Math.random()*options.length)];

  [tiles[pick],tiles[empty]]=[tiles[empty],tiles[pick]];
  previous=empty;
  empty=pick;
 }

 if(tiles.every((v,i)=>v===solved(n)[i])){
  let p=neighbor(empty,n)[0];
  [tiles[p],tiles[empty]]=[tiles[empty],tiles[p]];
 }

 initial=tiles.slice();
 moves=0;
 won=false;
 newButton.textContent='NEW PUZZLE';
 status.textContent='Slide a tile into the empty space.';
 draw();
}

function move(i){
 if(won)return;

 const n=size(),empty=tiles.indexOf(0);
 if(!neighbor(empty,n).includes(i))return;

 [tiles[i],tiles[empty]]=[tiles[empty],tiles[i]];
 moves++;

 won=tiles.every((v,j)=>v===solved(n)[j]);

 if(won){
  status.textContent='🎉 Well done! You solved the puzzle.';
  newButton.textContent='NEXT LEVEL';

  try{
   localStorage.setItem(
    'faozan_numbers_level',
    String(level+1)
   )
  }catch(e){}
 }

 draw();
}

document.getElementById('restart').addEventListener('click',()=>{
 tiles=initial.slice();
 moves=0;
 won=false;
 newButton.textContent='NEW PUZZLE';
 status.textContent='Puzzle restarted.';
 draw();
});

newButton.addEventListener('click',()=>{
 if(won)level++;
 start();
});

start();
})();
</script>
</body>
</html>
