

<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>FAOZAN Games</title>

  <style>

    * { box-sizing: border-box; }

    body {

      margin: 0;

      min-height: 100vh;

      font-family: Arial, sans-serif;

      background: linear-gradient(150deg, #10172b, #263c62);

      color: white;

      text-align: center;

    }

    header { padding: 45px 16px 20px; }

    h1 { font-size: 36px; margin-bottom: 10px; }

    .subtitle { color: #b9d5ed; }

    .card {

      margin: 35px auto;

      padding: 30px 20px;

      width: 90%;

      max-width: 420px;

      border-radius: 25px;

      background: rgba(255,255,255,.12);

      border: 1px solid rgba(255,255,255,.3);

      box-shadow: 0 15px 35px #0005;

    }

    .symbol { font-size: 65px; }

    button {

      padding: 16px 40px;

      border: 0;

      border-radius: 30px;

      background: linear-gradient(90deg,#29d4ff,#56ee91);

      font-size: 19px;

      font-weight: bold;

      cursor: pointer;

    }

    footer { padding: 30px; color: #a7b8d0; }

  </style>

</head>

<body>

  <header>

    <h1>FAOZAN GAMES</h1>

    <p class="subtitle">Play Free. Think Smart. Have Fun.</p>

  </header>

  <main>

    <section class="card">

      <div class="symbol">🔢</div>

      <h2>FAOZAN Numbers</h2>

      <p>A fun sliding number puzzle for everyone!</p>

      <button onclick="alert('Coming soon!')">COMING SOON</button>

    </section>

  </main>

  <footer>© 2026 FAOZAN Games</footer>

</body>

</html>
